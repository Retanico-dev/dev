name: Sync Leads from Google Sheets (Reta / Unsent)

on:
  schedule:
    # 毎日 午前9:00 と 午後21:00 (JST) に自動実行 (UTCでは 00:00 と 12:00)
    - cron: '0 0,12 * * *'
  workflow_dispatch: # GitHubのWeb画面から手動で即時実行可能

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gspread google-auth supabase

      - name: Run Sheets to Supabase Sync Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GCP_SA_KEY_JSON: ${{ secrets.GCP_SA_KEY_JSON }}
        run: |
          python scripts/sync_sheets_to_supabase.py
