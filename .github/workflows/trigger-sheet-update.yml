name: Update Sheet Status (On Demand Trigger)

on:
  repository_dispatch:
    types: [update-lead-status]

jobs:
  update-sheet:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth openpyxl

      - name: Run Update Script
        env:
          GCP_SA_KEY_JSON: ${{ secrets.GCP_SA_KEY_JSON }}
        run: |
          python scripts/update_sheet_status.py "${{ github.event.client_payload.client_name }}" "${{ github.event.client_payload.new_status }}"
