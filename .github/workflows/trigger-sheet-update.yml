name: Update Sheet Status (On Demand Trigger)

on:
  repository_dispatch:
    types: [update-lead-status]

jobs:
  update-sheet:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth openpyxl

      - name: Run Update Script
        env:
          GCP_SA_KEY_JSON: ${{ secrets.GCP_SA_KEY_JSON }}
          # 外部由来の値は ${{ }} でシェルに直接埋め込まず、環境変数経由で渡す（コマンドインジェクション対策）
          CLIENT_NAME: ${{ github.event.client_payload.client_name }}
          NEW_STATUS: ${{ github.event.client_payload.new_status }}
        run: |
          python scripts/update_sheet_status.py "$CLIENT_NAME" "$NEW_STATUS"
