<body class="bg-slate-50 text-slate-800 min-h-screen">

  <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <span class="text-xl font-bold bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent">ProjectFlow</span>
        <span id="roleBadge" class="hidden text-xs font-semibold px-2 py-0.5 rounded-full bg-slate-100 text-slate-600">Guest</span>
      </div>
      <div id="authActions" class="flex items-center space-x-3"></div>
    </div>

  <main class="max-w-7xl mx-auto px-4 py-8">
    <!-- ログイン画面 -->
    <div id="loginView" class="max-w-md mx-auto mt-12 p-6 bg-white rounded-xl shadow-sm border border-slate-200">
      <h2 class="text-xl font-bold mb-4 text-center">ログイン</h2>
      <form onsubmit="event.preventDefault(); handlePasswordLogin();" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">メールアドレス</label>
          <input type="email" id="loginEmail" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm" placeholder="user@example.com">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">パスワード</label>
          <input type="password" id="loginPassword" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm" placeholder="••••••••">
        </div>
        <button type="submit" id="btnPwLogin" class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg text-sm transition shadow-sm">
          ログイン
        </button>
      </form>
      <p id="loginMsg" class="mt-4 text-sm text-center font-medium"></p>
    </div>

    <!-- ダッシュボード画面 -->
    <div id="appView" class="hidden space-y-6">
      <div id="adminTabs" class="flex border-b border-slate-200 space-x-4">
        <button onclick="switchTab('creative')" id="tabCreative" class="pb-3 px-2 font-medium text-sm border-b-2 border-blue-600 text-blue-600">制作進行ボード</button>
        <button onclick="switchTab('sales')" id="tabSales" class="pb-3 px-2 font-medium text-sm border-b-2 border-transparent text-slate-500 hover:text-slate-700">営業・商談ボード</button>
        <button onclick="switchTab('master')" id="tabMaster" class="pb-3 px-2 font-medium text-sm border-b-2 border-transparent text-slate-500 hover:text-slate-700">工程マスター設定</button>
        <button onclick="switchTab('members')" id="tabMembers" class="pb-3 px-2 font-medium text-sm border-b-2 border-transparent text-slate-500 hover:text-slate-700">メンバー管理</button>
      </div>

      <!-- クリエイター用タスク表示 -->
      <div id="userTaskSection" class="hidden space-y-4">
        <h2 class="text-lg font-bold">担当タスク一覧</h2>
        <div id="userTaskList" class="grid gap-4 md:grid-cols-2"></div>
      </div>

      <!-- Admin: 制作進行ボード -->
      <div id="creativeSection" class="space-y-6">
        <div class="flex justify-between items-center">
          <h2 class="text-lg font-bold">制作案件パイプライン</h2>
          <button onclick="openModal('newProjectModal')" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium transition shadow-sm">
            + 新規案件起票
          </button>
        </div>
        <div id="projectList" class="space-y-4"></div>
      </div>

      <!-- Admin: 営業ボード -->
      <div id="salesSection" class="hidden space-y-6">
        <div class="flex justify-between items-center">
          <h2 class="text-lg font-bold">営業・商談パイプライン</h2>
          <button onclick="openModal('newSalesModal')" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium transition shadow-sm">
            + 営業リード追加
          </button>
        </div>
        <div id="salesList" class="grid gap-4 md:grid-cols-3"></div>
      </div>

      <!-- Admin: 工程マスター設定 -->
      <div id="masterSection" class="hidden space-y-6 max-w-2xl">
        <h2 class="text-lg font-bold">標準工程・仕掛日数設定</h2>
        <div class="bg-white p-4 rounded-xl border border-slate-200">
          <table class="w-full text-sm">
            <thead>
              <tr class="border-b text-slate-400 text-xs text-left">
                <th class="py-2">ライン</th>
                <th class="py-2">工程名</th>
                <th class="py-2">先行条件</th>
                <th class="py-2">標準所要日数</th>
              </tr>
            </thead>
            <tbody id="masterTableBody"></tbody>
          </table>
        </div>
      </div>

      <!-- Admin: メンバー管理 -->
      <div id="membersSection" class="hidden space-y-6 max-w-3xl">
        <div class="flex justify-between items-center">
          <h2 class="text-lg font-bold">所属クリエイター・メンバー一覧</h2>
          <button onclick="openModal('newMemberModal')" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium transition shadow-sm">
            + 新規メンバー追加
          </button>
        </div>
        <div class="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
          <table class="w-full text-sm">
            <thead class="bg-slate-50 border-b text-slate-500 text-xs text-left">
              <tr>
                <th class="p-3">表示名</th>
                <th class="p-3">メールアドレス</th>
                <th class="p-3">権限</th>
              </tr>
            </thead>
            <tbody id="membersTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <!-- モーダル: 新規メンバー追加 -->
  <div id="newMemberModal" class="hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 space-y-4">
      <h3 class="font-bold text-lg">新規メンバー（クリエイター）の追加</h3>
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">表示名（クリエイター名） *</label>
        <input type="text" id="newMemberName" required class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="山田 太郎">
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">メールアドレス *</label>
        <input type="email" id="newMemberEmail" required class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="creator@example.com">
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">初期パスワード *</label>
        <input type="password" id="newMemberPassword" required class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="6文字以上">
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">権限ロール</label>
        <select id="newMemberRole" class="w-full px-3 py-2 border rounded-lg text-sm bg-white">
          <option value="user">クリエイター (User: 自身のアサインタスクのみ閲覧)</option>
          <option value="admin">管理者 (Admin: 全案件・営業・メンバー管理可能)</option>
        </select>
      </div>
      <div class="flex justify-end space-x-2 pt-2">
        <button onclick="closeModal('newMemberModal')" class="px-4 py-2 border rounded-lg text-sm">キャンセル</button>
        <button onclick="createNewMember()" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium">作成・追加</button>
      </div>
    </div>
  </div>

  <!-- モーダル: 新規案件起票 -->
  <div id="newProjectModal" class="hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto">
      <h3 class="font-bold text-lg">新規制作案件の起票</h3>
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">案件・曲名 *</label>
        <input type="text" id="newPrjTitle" class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="例: 2nd Single 制作">
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">クライアント名</label>
        <input type="text" id="newPrjClient" class="w-full px-3 py-2 border rounded-lg text-sm">
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">共有ドライブ / フォルダURL</label>
        <input type="url" id="newPrjDrive" class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="https://drive.google.com/...">
      </div>

      <div class="border-t pt-4">
        <label class="block text-xs font-bold text-slate-700 mb-2">自動納期計算・工程組み込み</label>
        <div class="flex items-center space-x-2 mb-3">
          <label class="text-xs text-slate-500">着手予定日:</label>
          <input type="date" id="autoCalcStartDate" class="px-2 py-1 border rounded text-sm">
        </div>
        <div class="text-[11px] text-slate-400 mb-2">※楽曲（作曲→作詞/編曲→Rec→Mix→Mas）とMV（イラスト→映像）の並行日数を自動計算します</div>
        <div id="processCheckboxes" class="space-y-1.5 max-h-48 overflow-y-auto p-2 bg-slate-50 rounded-lg border text-sm"></div>
      </div>

      <div class="flex justify-end space-x-2 pt-2">
        <button onclick="closeModal('newProjectModal')" class="px-4 py-2 border rounded-lg text-sm">キャンセル</button>
        <button onclick="createCreativeProject()" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium">起票・タスク一括生成</button>
      </div>
    </div>
  </div>

  <!-- モーダル: 営業リード追加 -->
  <div id="newSalesModal" class="hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 space-y-4">
      <h3 class="font-bold text-lg">営業リード追加</h3>
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">クライアント名 / 案件名 *</label>
        <input type="text" id="salesTitle" class="w-full px-3 py-2 border rounded-lg text-sm">
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">次回MTG日時</label>
        <input type="datetime-local" id="salesMeeting" class="w-full px-3 py-2 border rounded-lg text-sm">
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">議事録 / メモURL</label>
        <input type="url" id="salesNotesUrl" class="w-full px-3 py-2 border rounded-lg text-sm">
      </div>
      <div class="flex justify-end space-x-2 pt-2">
        <button onclick="closeModal('newSalesModal')" class="px-4 py-2 border rounded-lg text-sm">キャンセル</button>
        <button onclick="createSalesLead()" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium">追加</button>
      </div>
    </div>
  </div>

  <script>
    let currentUser = null;
    let userProfile = null;
    let allProfiles = [];
    const collapsedProjects = new Set();

    // 業務パイプライン定義（先行工程依存・並び順）
    const WORKFLOW_DEF = [
      { key: 'compose', name: '作曲', days: 7, track: 'music', order: 1, depends: [] },
      { key: 'lyrics', name: '作詞', days: 5, track: 'music', order: 2, depends: ['作曲'] },
      { key: 'arrange', name: '編曲', days: 7, track: 'music', order: 3, depends: ['作曲'] },
      { key: 'rec', name: 'レコーディング', days: 3, track: 'music', order: 4, depends: ['作詞', '編曲'] },
      { key: 'mix', name: 'ミキシング', days: 5, track: 'music', order: 5, depends: ['レコーディング'] },
      { key: 'mastering', name: 'マスタリング', days: 2, track: 'music', order: 6, depends: ['ミキシング'] },
      { key: 'illust', name: 'イラスト', days: 14, track: 'mv', order: 1, depends: [] },
      { key: 'movie', name: '映像 (MV)', days: 10, track: 'mv', order: 2, depends: ['イラスト'] }
    ];

    async function handlePasswordLogin() {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value.trim();
      const msg = document.getElementById('loginMsg');

      if (!email || !password) return alert('入力してください');
      msg.innerText = "ログイン確認中...";
      msg.className = "mt-4 text-sm text-center text-blue-600 font-medium";

      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) {
          msg.innerText = "ログイン失敗: " + error.message;
          msg.className = "mt-4 text-sm text-center text-red-500 font-medium";
          alert("ログイン失敗: " + error.message);
        } else {
          msg.innerText = "";
          currentUser = data.user;
          await loadUserProfile();
        }
      } catch (err) {
        alert("通信エラー: " + err.message);
      }
    }

    async function init() {
      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session) {
          currentUser = session.user;
          await loadUserProfile();
        } else {
          renderAuthUI(false);
        }
      } catch (e) {
        console.error(e);
      }
    }

    async function loadUserProfile() {
      try {
        const { data } = await supabaseClient.from('profiles').select('*').eq('id', currentUser.id).single();
        userProfile = data || { role: 'admin', email: currentUser.email, name: currentUser.email.split('@')[0] };
        renderAuthUI(true);
        loadDashboard();
      } catch (err) {
        alert("ユーザープロファイル取得エラー: " + err.message);
      }
    }

    function renderAuthUI(isLoggedIn) {
      const loginView = document.getElementById('loginView');
      const appView = document.getElementById('appView');
      const authActions = document.getElementById('authActions');
      const roleBadge = document.getElementById('roleBadge');

      if (isLoggedIn && userProfile) {
        loginView.classList.add('hidden');
        appView.classList.remove('hidden');
        roleBadge.classList.remove('hidden');
        roleBadge.innerText = userProfile.role === 'admin' ? '管理者 (Admin)' : 'クリエイター (User)';
        roleBadge.className = userProfile.role === 'admin' 
          ? 'text-xs font-semibold px-2 py-0.5 rounded-full bg-indigo-100 text-indigo-700' 
          : 'text-xs font-semibold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700';

        authActions.innerHTML = '<span class="text-xs text-slate-500">' + (userProfile.name || userProfile.email) + '</span>'
          + '<button onclick="logout()" class="text-xs text-slate-500 hover:text-slate-800 underline">ログアウト</button>';

        if (userProfile.role === 'admin') {
          document.getElementById('adminTabs').classList.remove('hidden');
          document.getElementById('userTaskSection').classList.add('hidden');
          switchTab('creative');
        } else {
          document.getElementById('adminTabs').classList.add('hidden');
          document.getElementById('creativeSection').classList.add('hidden');
          document.getElementById('salesSection').classList.add('hidden');
          document.getElementById('masterSection').classList.add('hidden');
          document.getElementById('membersSection').classList.add('hidden');
          document.getElementById('userTaskSection').classList.remove('hidden');
          loadUserTasks();
        }
      } else {
        loginView.classList.remove('hidden');
        appView.classList.add('hidden');
        roleBadge.classList.add('hidden');
        authActions.innerHTML = '';
      }
    }

    async function logout() {
      await supabaseClient.auth.signOut();
      window.location.reload();
    }

    async function loadDashboard() {
      await loadAllProfiles();
      renderMasterTable();
      renderCheckboxes();
      if (userProfile.role === 'admin') {
        loadCreativeProjects();
        loadSalesProjects();
        renderMembersTable();
      }
    }

    async function loadAllProfiles() {
      const { data } = await supabaseClient.from('profiles').select('*').order('created_at', { ascending: false });
      allProfiles = data || [];
    }

    function renderMasterTable() {
      const tbody = document.getElementById('masterTableBody');
      if (!tbody) return;
      tbody.innerHTML = WORKFLOW_DEF.map(w => {
        const trackBadge = w.track === 'music' ? '<span class="px-1.5 py-0.5 rounded text-[10px] bg-blue-100 text-blue-700">楽曲</span>' : '<span class="px-1.5 py-0.5 rounded text-[10px] bg-purple-100 text-purple-700">MV</span>';
        const dependsText = w.depends.length > 0 ? w.depends.join(' ＋ ') : '着手日';
        return '<tr class="border-b last:border-b-0">'
          + '<td class="py-2">' + trackBadge + '</td>'
          + '<td class="py-2 font-medium">' + w.name + '</td>'
          + '<td class="py-2 text-slate-500 text-xs">' + dependsText + '</td>'
          + '<td class="py-2 text-slate-500">' + w.days + ' 日間</td>'
          + '</tr>';
      }).join('');
    }

    function renderCheckboxes() {
      const checkContainer = document.getElementById('processCheckboxes');
      if (!checkContainer) return;
      checkContainer.innerHTML = WORKFLOW_DEF.map(w => {
        const tag = w.track === 'music' ? '[楽曲]' : '[MV]';
        return '<label class="flex items-center space-x-2 cursor-pointer">'
          + '<input type="checkbox" value="' + w.key + '" data-name="' + w.name + '" data-days="' + w.days + '" data-track="' + w.track + '" checked class="rounded text-blue-600">'
          + '<span class="text-xs text-slate-700 font-medium">' + tag + ' ' + w.name + ' (' + w.days + '日)</span>'
          + '</label>';
      }).join('');

      const today = new Date();
      document.getElementById('autoCalcStartDate').value = today.toISOString().split('T')[0];
    }

    function renderMembersTable() {
      const tbody = document.getElementById('membersTableBody');
      if (!tbody) return;
      tbody.innerHTML = allProfiles.map(u => {
        const badgeClass = u.role === 'admin' ? 'bg-indigo-100 text-indigo-700' : 'bg-emerald-100 text-emerald-700';
        const roleName = u.role === 'admin' ? '管理者' : 'クリエイター';
        return '<tr class="border-b last:border-b-0">'
          + '<td class="p-3 font-medium">' + (u.name || '未設定') + '</td>'
          + '<td class="p-3 text-slate-500">' + (u.email || '-') + '</td>'
          + '<td class="p-3"><span class="px-2 py-0.5 rounded text-xs font-semibold ' + badgeClass + '">' + roleName + '</span></td>'
          + '</tr>';
      }).join('');
    }

    async function createNewMember() {
      const name = document.getElementById('newMemberName').value.trim();
      const email = document.getElementById('newMemberEmail').value.trim();
      const password = document.getElementById('newMemberPassword').value.trim();
      const role = document.getElementById('newMemberRole').value;

      if (!name || !email || !password) return alert('全ての項目を入力してください');
      if (password.length < 6) return alert('パスワードは6文字以上で指定してください');

      const tempClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        auth: { persistSession: false }
      });

      const { data, error } = await tempClient.auth.signUp({
        email: email,
        password: password,
        options: { data: { name: name } }
      });

      if (error) return alert('メンバー作成失敗: ' + error.message);

      if (data.user) {
        await supabaseClient.from('profiles').upsert({
          id: data.user.id,
          email: email,
          name: name,
          role: role
        });
      }

      alert('メンバー「' + name + '」を追加しました！');
      closeModal('newMemberModal');
      document.getElementById('newMemberName').value = '';
      document.getElementById('newMemberEmail').value = '';
      document.getElementById('newMemberPassword').value = '';
      await loadAllProfiles();
      renderMembersTable();
    }

    function getActiveBallTasks(tasks) {
      const completedSet = new Set(tasks.filter(t => t.status === '完了').map(t => t.title));
      const activeTasks = [];

      tasks.forEach(t => {
        if (t.status === '完了') return;
        const def = WORKFLOW_DEF.find(w => w.name === t.title);
        const isReady = !def || def.depends.every(dep => completedSet.has(dep));
        if (isReady) {
          activeTasks.push(t);
        }
      });
      return activeTasks;
    }

    function toggleProjectCollapse(prjId) {
      if (collapsedProjects.has(prjId)) {
        collapsedProjects.delete(prjId);
      } else {
        collapsedProjects.add(prjId);
      }
      loadCreativeProjects();
    }

    async function loadCreativeProjects() {
      const { data: prjs } = await supabaseClient
        .from('projects')
        .select('*, tasks(*)')
        .eq('type', 'creative')
        .order('created_at', { ascending: false });

      const container = document.getElementById('projectList');
      if (!prjs || prjs.length === 0) {
        container.innerHTML = '<div class="p-8 text-center text-slate-400 bg-white rounded-xl border">進行中の案件はありません</div>';
        return;
      }

      const todayStr = new Date().toISOString().split('T')[0];

      container.innerHTML = prjs.map(p => {
        const isCollapsed = collapsedProjects.has(p.id);

        // 工程フロー順にタスクを厳密ソート
        const tasks = (p.tasks || []).sort((a,b) => {
          const defA = WORKFLOW_DEF.find(w => w.name === a.title);
          const defB = WORKFLOW_DEF.find(w => w.name === b.title);
          const orderA = defA ? defA.order : (a.sort_order || 99);
          const orderB = defB ? defB.order : (b.sort_order || 99);
          return orderA - orderB;
        });

        const activeTasks = getActiveBallTasks(tasks);

        let ballBadgeHtml = '';
        if (tasks.length > 0 && tasks.every(t => t.status === '完了')) {
          ballBadgeHtml = '<span class="px-2.5 py-1 rounded-full text-xs font-bold bg-slate-100 text-slate-600">✓ 全工程完了</span>';
        } else if (activeTasks.length === 0) {
          ballBadgeHtml = '<span class="px-2.5 py-1 rounded-full text-xs font-bold bg-slate-100 text-slate-500">待機中</span>';
        } else {
          ballBadgeHtml = activeTasks.map(t => {
            if (t.status === '提出・確認待ち') {
              return '<span class="px-2.5 py-1 rounded-full text-xs font-bold bg-amber-100 text-amber-800 border border-amber-300">🟡 確認待ち: ' + t.title + '</span>';
            }
            const assignee = allProfiles.find(u => u.id === t.assignee_id);
            const assigneeName = assignee ? (assignee.name || assignee.email) : '未アサイン';
            const isOverdue = t.deadline && t.deadline < todayStr;
            const badgeClass = isOverdue ? 'bg-red-100 text-red-700 border border-red-300' : 'bg-blue-100 text-blue-800 border border-blue-200';
            return '<div class="inline-flex items-center space-x-1 px-2.5 py-1 rounded-full text-xs font-bold ' + badgeClass + '">'
              + '<span>🔴 ボール: <strong>' + assigneeName + '</strong> (' + t.title + ')</span>'
              + '</div>';
          }).join(' ');
        }

        const driveLinkHtml = p.drive_url ? '<a href="' + p.drive_url + '" target="_blank" onclick="event.stopPropagation();" class="text-xs px-2.5 py-1 bg-slate-100 hover:bg-slate-200 rounded text-slate-700 font-medium">Drive ↗</a>' : '';

        // トラック別に分類（ソート順維持）
        const musicTasks = tasks.filter(t => {
          const w = WORKFLOW_DEF.find(def => def.name === t.title);
          return !w || w.track === 'music';
        });
        const mvTasks = tasks.filter(t => {
          const w = WORKFLOW_DEF.find(def => def.name === t.title);
          return w && w.track === 'mv';
        });

        const renderTaskCards = (taskList) => {
          return taskList.map(t => {
            const isOverdue = t.deadline && t.deadline < todayStr && t.status !== '完了';
            const isActive = activeTasks.some(at => at.id === t.id);

            let cardClass = 'bg-white border-slate-200';
            if (t.status === '完了') {
              cardClass = 'bg-slate-50 border-slate-200 text-slate-400';
            } else if (isActive) {
              cardClass = 'bg-blue-50/50 border-blue-400 ring-2 ring-blue-100 shadow-sm';
            }

            const statusOptions = ['未着手', '作業中', '提出・確認待ち', 'リテイク', '完了'].map(st => {
              const selected = t.status === st ? 'selected' : '';
              return '<option value="' + st + '" ' + selected + '>' + st + '</option>';
            }).join('');

            const profileOptions = allProfiles.map(u => {
              const selected = t.assignee_id === u.id ? 'selected' : '';
              return '<option value="' + u.id + '" ' + selected + '>' + (u.name || u.email) + '</option>';
            }).join('');

            const deadlineInputClass = isOverdue ? 'text-red-600 font-bold bg-red-50' : 'text-slate-700';
            const deliverableHtml = t.deliverable_url 
              ? '<a href="' + t.deliverable_url + '" target="_blank" class="block text-center py-1 bg-blue-50 text-blue-600 rounded font-medium text-[11px] hover:bg-blue-100 truncate">提出物リンク ↗</a>'
              : '';

            return '<div class="p-3 rounded-lg border text-xs space-y-2 transition-all ' + cardClass + '">'
              + '<div class="flex justify-between items-center font-bold">'
              + '<span class="' + (isActive ? 'text-blue-700 font-extrabold' : '') + '">' + t.title + '</span>'
              + '<select onchange="updateTaskStatus(\'' + t.id + '\', this.value)" class="text-[11px] px-1.5 py-0.5 border rounded bg-white font-medium">'
              + statusOptions
              + '</select>'
              + '</div>'
              + '<div class="flex items-center space-x-1">'
              + '<span class="text-[10px] text-slate-400">担当:</span>'
              + '<select onchange="assignTask(\'' + t.id + '\', this.value)" class="text-[11px] w-full px-1 py-0.5 border rounded bg-white">'
              + '<option value="">-- 未設定 --</option>'
              + profileOptions
              + '</select>'
              + '</div>'
              + '<div class="flex items-center justify-between text-[11px] pt-1 border-t">'
              + '<span class="text-slate-400">期限:</span>'
              + '<input type="date" value="' + (t.deadline || '') + '" onchange="updateTaskDeadline(\'' + t.id + '\', this.value)" class="border rounded px-1 text-[11px] ' + deadlineInputClass + '">'
              + '</div>'
              + deliverableHtml
              + '</div>';
          }).join('');
        };

        const toggleBtnIcon = isCollapsed ? '▼ 展開' : '▲ 閉じる';

        return '<div class="bg-white rounded-xl border border-slate-200 shadow-sm transition overflow-hidden">'
          // ヘッダー（クリックで開閉）
          + '<div onclick="toggleProjectCollapse(\'' + p.id + '\')" class="p-4 flex flex-wrap items-center justify-between gap-2 cursor-pointer hover:bg-slate-50 transition ' + (isCollapsed ? '' : 'border-b') + '">'
          + '<div class="flex items-center space-x-3">'
          + '<button type="button" class="text-xs font-semibold px-2 py-1 bg-slate-100 text-slate-600 rounded hover:bg-slate-200">' + toggleBtnIcon + '</button>'
          + '<div>'
          + '<span class="text-xs text-slate-400 font-medium">' + (p.client_name || 'クライアント未設定') + '</span>'
          + '<h3 class="text-base font-bold text-slate-800">' + p.title + '</h3>'
          + '</div>'
          + '</div>'
          + '<div class="flex flex-wrap items-center gap-2">'
          + ballBadgeHtml
          + driveLinkHtml
          + '</div>'
          + '</div>'

          // アコーディオン中身（折りたたみ対象）
          + (!isCollapsed ? (
            '<div class="p-5 space-y-4 bg-white">'
            // 楽曲トラック表示
            + '<div class="space-y-1.5">'
            + '<div class="flex items-center space-x-2"><span class="w-2 h-2 rounded-full bg-blue-500"></span><span class="text-xs font-bold text-slate-700">楽曲トラック (作曲 ➔ 作詞 ➔ 編曲 ➔ Rec ➔ Mix ➔ Mas)</span></div>'
            + '<div class="grid gap-2.5 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-6">'
            + renderTaskCards(musicTasks)
            + '</div>'
            + '</div>'

            // MVトラック表示
            + (mvTasks.length > 0 ? (
              '<div class="space-y-1.5 pt-2 border-t border-dashed">'
              + '<div class="flex items-center space-x-2"><span class="w-2 h-2 rounded-full bg-purple-500"></span><span class="text-xs font-bold text-slate-700">MVトラック (イラスト ➔ 映像)</span></div>'
              + '<div class="grid gap-2.5 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4">'
              + renderTaskCards(mvTasks)
              + '</div>'
              + '</div>'
            ) : '')
            + '</div>'
          ) : '')

          + '</div>';
      }).join('');
    }

    async function assignTask(taskId, assigneeId) {
      await supabaseClient.from('tasks').update({ assignee_id: assigneeId || null }).eq('id', taskId);
      loadCreativeProjects();
    }

    async function updateTaskStatus(taskId, status) {
      await supabaseClient.from('tasks').update({ status }).eq('id', taskId);
      loadCreativeProjects();
    }

    async function updateTaskDeadline(taskId, deadline) {
      await supabaseClient.from('tasks').update({ deadline: deadline || null }).eq('id', taskId);
      loadCreativeProjects();
    }

    async function createCreativeProject() {
      const title = document.getElementById('newPrjTitle').value;
      const client = document.getElementById('newPrjClient').value;
      const drive = document.getElementById('newPrjDrive').value;
      const startDateStr = document.getElementById('autoCalcStartDate').value;

      if (!title) return alert('案件名を入力してください');

      const { data: prj, error: prjErr } = await supabaseClient.from('projects').insert({
        type: 'creative',
        title, client_name: client, drive_url: drive, status: '進行中'
      }).select().single();

      if (prjErr) return alert(prjErr.message);

      const checkedKeys = new Set(
        Array.from(document.querySelectorAll('#processCheckboxes input:checked')).map(cb => cb.value)
      );

      const baseDate = new Date(startDateStr || new Date());
      const addDays = (d, n) => {
        const res = new Date(d);
        res.setDate(res.getDate() + n);
        return res;
      };
      const fmt = (d) => d.toISOString().split('T')[0];

      const getD = (k) => {
        const found = WORKFLOW_DEF.find(w => w.key === k);
        return found ? found.days : 0;
      };

      const dates = {};
      dates.compose = addDays(baseDate, getD('compose'));
      dates.lyrics = addDays(dates.compose, getD('lyrics'));
      dates.arrange = addDays(dates.compose, getD('arrange'));
      const recStart = (dates.lyrics > dates.arrange) ? dates.lyrics : dates.arrange;
      dates.rec = addDays(recStart, getD('rec'));
      dates.mix = addDays(dates.rec, getD('mix'));
      dates.mastering = addDays(dates.mix, getD('mastering'));
      dates.illust = addDays(baseDate, getD('illust'));
      dates.movie = addDays(dates.illust, getD('movie'));

      const tasksToInsert = [];
      WORKFLOW_DEF.forEach(w => {
        if (checkedKeys.has(w.key)) {
          tasksToInsert.push({
            project_id: prj.id,
            title: w.name,
            deadline: fmt(dates[w.key]),
            sort_order: w.order,
            status: '未着手'
          });
        }
      });

      if (tasksToInsert.length > 0) {
        await supabaseClient.from('tasks').insert(tasksToInsert);
      }

      closeModal('newProjectModal');
      loadCreativeProjects();
    }

    async function loadSalesProjects() {
      const { data: sales } = await supabaseClient.from('projects').select('*').eq('type', 'sales').order('created_at', { ascending: false });
      const container = document.getElementById('salesList');
      if (!sales || sales.length === 0) {
        container.innerHTML = '<div class="col-span-3 p-8 text-center text-slate-400 bg-white rounded-xl border">営業リードはありません</div>';
        return;
      }

      container.innerHTML = sales.map(s => {
        const statusOptions = ['リード', '初回MTG', '提案中', '成約', '失注'].map(st => {
          const selected = s.status === st ? 'selected' : '';
          return '<option value="' + st + '" ' + selected + '>' + st + '</option>';
        }).join('');

        const meetingText = s.next_meeting_at ? new Date(s.next_meeting_at).toLocaleString('ja-JP') : '未定';
        const notesHtml = s.meeting_notes_url ? '<a href="' + s.meeting_notes_url + '" target="_blank" class="text-xs text-blue-600 block hover:underline truncate">議事録リンク ↗</a>' : '';
        const wonBadgeHtml = s.status === '成約' ? '<div class="p-2 bg-emerald-50 text-emerald-700 text-[11px] rounded font-medium">✓ 成約済</div>' : '';

        return '<div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-3">'
          + '<div class="flex justify-between items-start">'
          + '<h4 class="font-bold text-sm text-slate-800">' + s.title + '</h4>'
          + '<select onchange="updateSalesStatus(\'' + s.id + '\', this.value)" class="text-xs px-2 py-1 border rounded bg-slate-50 font-medium">'
          + statusOptions
          + '</select>'
          + '</div>'
          + '<div class="text-xs text-slate-500">次回MTG: ' + meetingText + '</div>'
          + notesHtml
          + wonBadgeHtml
          + '</div>';
      }).join('');
    }

    async function updateSalesStatus(id, newStatus) {
      await supabaseClient.from('projects').update({ status: newStatus }).eq('id', id);
      loadSalesProjects();
    }

    async function createSalesLead() {
      const title = document.getElementById('salesTitle').value;
      const meeting = document.getElementById('salesMeeting').value;
      const notes = document.getElementById('salesNotesUrl').value;
      if (!title) return alert('案件名を入力してください');

      await supabaseClient.from('projects').insert({
        type: 'sales',
        title,
        next_meeting_at: meeting ? new Date(meeting).toISOString() : null,
        meeting_notes_url: notes,
        status: 'リード'
      });

      closeModal('newSalesModal');
      loadSalesProjects();
    }

    async function loadUserTasks() {
      const { data: tasks } = await supabaseClient
        .from('tasks')
        .select('*, projects(title, drive_url)')
        .eq('assignee_id', currentUser.id)
        .order('deadline', { ascending: true });

      const container = document.getElementById('userTaskList');
      if (!tasks || tasks.length === 0) {
        container.innerHTML = '<div class="col-span-2 p-8 text-center text-slate-400 bg-white rounded-xl border">現在アサインされているタスクはありません</div>';
        return;
      }

      container.innerHTML = tasks.map(t => {
        const prjTitle = (t.projects && t.projects.title) ? t.projects.title : '案件名なし';
        const deadlineText = t.deadline || '未定';
        const deliverableVal = t.deliverable_url || '';

        return '<div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-3">'
          + '<div class="text-xs text-slate-400 font-medium">' + prjTitle + '</div>'
          + '<h4 class="text-base font-bold">' + t.title + '</h4>'
          + '<div class="text-xs text-slate-500">締切期日: <span class="font-bold text-slate-800">' + deadlineText + '</span></div>'
          + '<div class="pt-2 border-t space-y-2">'
          + '<label class="block text-xs text-slate-600 font-medium">提出物URL:</label>'
          + '<input type="url" id="deliv_' + t.id + '" value="' + deliverableVal + '" class="w-full px-3 py-1.5 border rounded text-xs" placeholder="https://...">'
          + '<div class="flex justify-between items-center pt-1">'
          + '<span class="text-xs font-semibold text-blue-600">ステータス: ' + t.status + '</span>'
          + '<button onclick="submitTask(\'' + t.id + '\')" class="px-3 py-1.5 bg-blue-600 text-white rounded text-xs font-medium hover:bg-blue-700 transition">'
          + '提出・確認待ちにする'
          + '</button>'
          + '</div>'
          + '</div>'
          + '</div>';
      }).join('');
    }

    async function submitTask(taskId) {
      const url = document.getElementById('deliv_' + taskId).value;
      if (!url) return alert('提出物URLを入力してください');

      await supabaseClient.from('tasks').update({
        deliverable_url: url,
        status: '提出・確認待ち'
      }).eq('id', taskId);

      alert('提出が完了しました！');
      loadUserTasks();
    }

    function switchTab(tab) {
      ['creative', 'sales', 'master', 'members'].forEach(t => {
        const el = document.getElementById(t + 'Section');
        if (el) el.classList.toggle('hidden', t !== tab);
        const btn = document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1));
        if (btn) {
          if (t === tab) {
            btn.className = "pb-3 px-2 font-medium text-sm border-b-2 border-blue-600 text-blue-600";
          } else {
            btn.className = "pb-3 px-2 font-medium text-sm border-b-2 border-transparent text-slate-500 hover:text-slate-700";
          }
        }
      });
    }

    function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

    init();
  </script>
